    <!-- JSON-LD: FAQ -->

        {
          "@type": "Question",
          "name": "O que é a i9 Learning e que serviços oferece?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A i9 Learning é uma empresa portuguesa especializada em soluções de eLearning e formação online, com sede em Coimbra. Oferecemos implementação de plataformas LMS Moodle (Moodle LMS e Moodle Workplace), produção de conteúdos interativos com Articulate Storyline, Rise 360 e H5P, exportáveis em SCORM 1.2, SCORM 2004 e xAPI. Também disponibilizamos soluções de inteligência artificial aplicada à formação, consultoria EdTech, desenho instrucional, suporte técnico e formação personalizada em tecnologias educativas."
          }
        },
        {
          "@type": "Question",
          "name": "Que plataformas LMS a i9 Learning implementa?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Somos especialistas na implementação de Moodle LMS e Moodle Workplace. As nossas plataformas suportam normas SCORM 1.2, SCORM 2004, xAPI (Experience API/Tin Can API) e LTI (Learning Tools Interoperability), garantindo total interoperabilidade com ferramentas como Articulate Storyline, Rise 360 e H5P. Configuramos integração SSO, eCommerce de cursos, relatórios avançados e conformidade com DGERT e IEFP."
          }
        },
        {
          "@type": "Question",
          "name": "Que ferramentas usam para criar conteúdos eLearning?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Utilizamos Articulate Storyline e Rise 360 para criação de cursos interativos profissionais, H5P para conteúdos abertos e interativos, e ferramentas de produção multimédia para vídeo, motion graphics e animações. Todos os conteúdos são exportados em formato SCORM 1.2 ou SCORM 2004, compatíveis com qualquer Learning Management System (LMS). Aplicamos estratégias de gamificação, microlearning e blended learning."
          }
        },
        {
          "@type": "Question",
          "name": "A i9 Learning oferece soluções de IA para formação?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim, integramos inteligência artificial em plataformas LMS e cursos online para criar experiências de aprendizagem adaptativa (adaptive learning). As nossas soluções incluem tutores virtuais inteligentes, geração automática de materiais de estudo, análise preditiva de desempenho, sistemas de recomendação de conteúdos personalizados e avaliação automática com feedback contextualizado."
          }
        },
        {
          "@type": "Question",
          "name": "Com que setores trabalha a i9 Learning?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Trabalhamos com diversos setores incluindo Corporate & Business (academias internas e onboarding digital), Educação & Academia, Saúde & Indústria Farmacêutica, Retalho & Serviços, Formação Profissional & Consultoria, Banca & Seguros, Indústria & Engenharia, Serviços Profissionais e Restauração & Hotelaria. Cada solução é desenhada à medida com digitalização de conteúdos formativos e gestão de formação online."
          }
        },
        {
          "@type": "Question",
          "name": "Como contactar a i9 Learning?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pode contactar-nos através do email geral.i9learning@gmail.com, pelo telemóvel +351 910 213 246 (WhatsApp disponível), ou através do formulário de contacto no nosso website i9learning.pt. Estamos em Coimbra, Portugal, e servimos clientes em todo o território nacional e PALOP."
          }
